# Servidor estático para la aplicación Flutter Web.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Enrutamiento del lado del cliente: cualquier ruta que no sea un archivo
  # existente devuelve index.html. Sin esto, recargar el navegador en
  # /causas da 404, que es el error más común al desplegar una SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # El nombre de los archivos compilados lleva hash, así que pueden cachearse
  # de forma indefinida. index.html no: es el que apunta a los demás, y
  # cachearlo dejaría al navegador pidiendo una versión que ya no existe.
  location ~* \.(js|css|woff2|png|jpg|svg|json)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Cabeceras de seguridad. La API manda las suyas con helmet; esto cubre el
  # sitio estático, que helmet no toca.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
