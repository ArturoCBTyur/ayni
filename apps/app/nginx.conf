# Servidor estático para la aplicación Flutter Web.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Cabeceras de seguridad. La API manda las suyas con helmet; esto cubre el
  # sitio estático, que helmet no toca.
  #
  # Van solo aquí, a nivel de server, y ninguna location declara add_header:
  # en nginx, una location con su propio add_header NO suma a estas, las
  # reemplaza todas. Con un Cache-Control por location, los .js y el
  # index.html salían sin ninguna de las tres.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Todo se revalida en cada carga (304 si no cambió, gracias al ETag).
  #
  # Flutter Web no pone hash en los nombres: main.dart.js, flutter_bootstrap.js
  # y la fuente de íconos —que se recorta a los íconos que usa la app— se
  # llaman igual en cada versión. Cachearlos como inmutables dejaba a quien ya
  # había entrado con el código viejo hasta un año después de un despliegue,
  # o con cuadros vacíos donde van los íconos nuevos.
  add_header Cache-Control "no-cache" always;

  # Enrutamiento del lado del cliente: cualquier ruta que no sea un archivo
  # existente devuelve index.html. Sin esto, recargar el navegador en
  # /causas da 404, que es el error más común al desplegar una SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;
}
