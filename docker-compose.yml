# ---------------------------------------------------------------------------
# Trazabilidad Radical — entorno completo reproducible.
#
# Levanta la base, la API y la aplicación web. Sirve para dos cosas: que quien
# revise el proyecto pueda correrlo sin instalar PostgreSQL, Node ni Flutter, y
# que el despliegue de la Fase 11 use la misma imagen que se probó en local.
#
#   docker compose up --build
#
# El servicio `migraciones` aplica el esquema y las semillas antes de que
# arranque la API, y termina. Para el escenario completo del guion de demo:
#
#   docker compose run --rm migraciones npx tsx prisma/seed-demo.ts
#
# Respaldo y restauración (RNF-13, ver docs/respaldo.md):
#
#   docker compose --profile respaldo run --rm respaldo
#
# Los puertos del anfitrión se cambian sin tocar este archivo, para cuando ya
# hay algo escuchando en ellos:
#
#   API_PUERTO=3100 WEB_PUERTO=8180 docker compose up --build
#
# El desarrollo del día a día NO usa esto: es más rápido con el PostgreSQL
# nativo del puerto 5433 y `npm run dev` (ver README).
# ---------------------------------------------------------------------------

# Lo que comparten la API y los servicios de operación que corren sobre la
# misma base y los mismos archivos.
x-base-de-datos: &base-de-datos
  DATABASE_URL: postgresql://tr_app:${POSTGRES_PASSWORD:-tr_app_local}@base:5432/trazabilidad_radical?schema=public

x-archivos: &archivos-cifrados
  STORAGE_DIR: /app/storage
  # RNF-01. Clave de ejemplo, solo para levantar el entorno local. En el
  # despliegue se genera con `openssl rand -base64 32`, se carga como secreto
  # del proveedor y se custodia APARTE de los respaldos: sin ella, un respaldo
  # devuelve las evidencias ilegibles.
  CIFRADO_CLAVE: ${CIFRADO_CLAVE:-bG9jYWwtc29sby1wYXJhLWNvbXBvc2UtY2lmcmFkbzA=}
  CIFRADO_CLAVES_ANTERIORES: ${CIFRADO_CLAVES_ANTERIORES:-}

services:
  base:
    image: postgres:18
    environment:
      POSTGRES_USER: tr_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tr_app_local}
      POSTGRES_DB: trazabilidad_radical
    ports:
      # 5433 en el anfitrión para no chocar con un PostgreSQL ya instalado,
      # que es exactamente la situación de la máquina donde se desarrolló.
      # Solo en 127.0.0.1: la base no tiene por qué ser alcanzable desde la red.
      - '127.0.0.1:${BASE_PUERTO:-5433}:5432'
    volumes:
      # Desde la 18, la imagen guarda los datos en /var/lib/postgresql/18/docker
      # y se niega a arrancar si encuentra un volumen montado en el antiguo
      # /var/lib/postgresql/data. El volumen va un nivel arriba.
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tr_app -d trazabilidad_radical']
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplica migraciones y semillas, y termina. Corre sobre la etapa `build` de
  # la misma imagen porque el CLI de Prisma es una dependencia de desarrollo y
  # la imagen de produccion la omite a proposito: un contenedor que sirve
  # peticiones no tiene por que poder alterar el esquema.
  #
  # Monta los archivos porque tambien es el contenedor de operacion: la semilla
  # de la demo escribe evidencias, y `npm run cifrado:migrar` las vuelve a
  # sellar al rotar la clave. Corre como `node`, el mismo usuario que la API:
  # como root, lo que escribiera quedaria de root y la API no podria
  # reescribirlo ni guardar nada nuevo en esas carpetas.
  migraciones:
    build:
      context: ./apps/api
      target: build
    user: node
    depends_on:
      base:
        condition: service_healthy
    environment:
      <<: [*base-de-datos, *archivos-cifrados]
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    volumes:
      - archivos:/app/storage
    restart: 'no'

  api:
    build:
      context: ./apps/api
    depends_on:
      base:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    environment:
      <<: [*base-de-datos, *archivos-cifrados]
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1

      # Secretos de ejemplo: sirven para levantar el entorno local y no valen
      # para nada más. En el despliegue se generan con `openssl rand -base64 48`
      # y se cargan como variables del proveedor, nunca desde este archivo.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-solo-para-compose-acceso-000000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-solo-para-compose-refresh-00000}
      COOKIE_SECRET: ${COOKIE_SECRET:-local-solo-para-compose-cookie-000000}
      STORAGE_URL_SECRET: ${STORAGE_URL_SECRET:-local-solo-para-compose-storage-00000}
      PASARELA_WEBHOOK_SECRET: ${PASARELA_WEBHOOK_SECRET:-local-solo-para-compose-webhook-00000}
      ENCUESTAS_CLAVE: ${ENCUESTAS_CLAVE:-local-solo-para-compose-encuestas-0000}

      CORS_ORIGENES: http://localhost:${WEB_PUERTO:-8080}
      STORAGE_DRIVER: disco
      PASARELA_DRIVER: fake
      PASARELA_WEBHOOK_URL: http://api:3000/api/v1/webhooks/pasarela
      CPE_DRIVER: fake
      VERIFICACION_DRIVER: reglas-v0
    ports:
      - '${API_PUERTO:-3000}:3000'
    volumes:
      - archivos:/app/storage

  web:
    build:
      context: ./apps/app
      args:
        # La URL de la API queda compilada dentro del sitio estático: si cambia
        # el puerto del anfitrión, cambia aquí también.
        API_BASE_URL: http://localhost:${API_PUERTO:-3000}/api/v1
    depends_on:
      - api
    ports:
      - '${WEB_PUERTO:-8080}:80'

  # RNF-13. No arranca con `up`: se invoca a mano o desde un cron del anfitrión.
  # Usa la imagen de PostgreSQL porque pg_dump tiene que ser de la misma
  # versión mayor que el servidor, o más nueva.
  respaldo:
    image: postgres:18
    profiles: ['respaldo']
    depends_on:
      base:
        condition: service_healthy
    environment:
      <<: *base-de-datos
      ARCHIVOS_DIR: /archivos
      # Para restaurar: a dónde. Por defecto, una base de simulacro en el mismo
      # servidor, nunca la de trabajo.
      DATABASE_URL_DESTINO: ${DATABASE_URL_DESTINO:-postgresql://tr_app:${POSTGRES_PASSWORD:-tr_app_local}@base:5432/trazabilidad_simulacro}
      ARCHIVOS_DIR_DESTINO: ${ARCHIVOS_DIR_DESTINO:-}
      RETENER: ${RETENER:-}
    volumes:
      - archivos:/archivos:ro
      - ./respaldos:/respaldos
      - ./apps/api/scripts/respaldo:/scripts:ro
    entrypoint: ['bash']
    command: ['/scripts/respaldar.sh', '/respaldos']

volumes:
  datos_postgres:
  archivos:
