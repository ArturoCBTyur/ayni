name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tr_app
          POSTGRES_PASSWORD: tr_app_ci
          POSTGRES_DB: trazabilidad_radical
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tr_app:tr_app_ci@localhost:5432/trazabilidad_radical?schema=public
      JWT_ACCESS_SECRET: ci-secreto-de-acceso-para-pruebas-solamente
      JWT_REFRESH_SECRET: ci-secreto-de-refresh-para-pruebas-solamente
      COOKIE_SECRET: ci-secreto-de-cookie-para-pruebas-solamente
      STORAGE_URL_SECRET: ci-secreto-de-urls-para-pruebas-solamente
      PASARELA_WEBHOOK_SECRET: ci-secreto-de-webhook-para-pruebas-solo
      # RNF-01: la suite corre con el cifrado en reposo activo, para que cada
      # subida, descarga y difuminado de las pruebas pase por el sobre.
      CIFRADO_CLAVE: Y2ktY2xhdmUtZGUtY2lmcmFkby1zb2xvLXBydWViYXM=
      NODE_ENV: test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      # Aplica la migracion inicial y las reglas de integridad de la
      # seccion 6.6. Si un trigger no compila, CI falla aqui.
      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      # Las pruebas crean sus propias cuentas pero buscan los roles del
      # catalogo, que vienen de la semilla. Sin este paso, 12 de las 17 suites
      # fallaban con "No record was found" al buscar el rol DONANTE.
      - name: Semilla base (roles, regla vigente, motor)
        run: npm run seed

      - name: Lint
        run: npm run lint

      - name: Compilar
        run: npm run build

      # El umbral de cobertura de RNF-19 (>= 70 % en contable y gastos)
      # esta configurado en jest.config.js y hace fallar el job.
      - name: Pruebas con cobertura
        run: npm run test:cov

  app:
    name: App (Flutter Web)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      # El lockfile se versiona: CI resuelve exactamente lo que se probo.
      - run: flutter pub get --enforce-lockfile

      - name: Analisis estatico
        run: flutter analyze

      - name: Pruebas de widgets
        run: flutter test

      - name: Compilar para web
        run: flutter build web --release

  aini:
    name: AIni (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/aini

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/aini/requirements.txt

      # opencv, que llega con rapidocr, enlaza contra libGL aunque nunca abra
      # una ventana. Sin esto el lector falla al importarse.
      - name: Bibliotecas del sistema
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - run: pip install -r requirements.txt

      - name: Modelo de lenguaje
        run: python -m spacy download es_core_news_md

      # El modelo entrenado no se versiona. Con la semilla fija, este es el
      # mismo modelo contra el que se escribieron las pruebas.
      - name: Entrenar detector de anomalias
        run: python -m entrenamiento.entrenar

      - name: Pruebas
        run: python -m pytest pruebas/ -q

      # Solo conceptos: spaCy da los mismos vectores en cualquier sistema. El
      # lector depende de las fuentes y de onnxruntime de cada plataforma, y
      # su banco de campo no esta en el repo; se compara en local.
      - name: Evaluacion contra la linea base
        run: python -m evaluacion --solo conceptos --comparar

  docker:
    name: Imagenes Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Las imagenes estuvieron escritas y nunca construidas hasta la Fase 11.
      # La primera vez que se levantaron no funciono ninguna de las tres: la
      # web no construia (faltaba pubspec.lock), la API se caia al arrancar
      # (Prisma generado sin OpenSSL) y PostgreSQL 18 no arrancaba con el
      # volumen en la ruta antigua. Construir en cada cambio evita repetirlo.
      - name: Validar docker-compose.yml
        run: docker compose --profile respaldo config --quiet

      - name: Construir API y web
        run: docker compose build

      # RNF-13. Un respaldo que nunca se restauro no esta probado: se respalda
      # el escenario de la demo, se restaura en una base vacia y restaurar.sh
      # falla si lo restaurado no es el mismo libro contable.
      - name: Simulacro de respaldo y restauracion
        run: |
          docker compose up -d base
          docker compose run --rm migraciones
          docker compose run --rm migraciones npx tsx prisma/seed-demo.ts
          docker compose --profile respaldo run --rm respaldo
          docker compose exec -T base createdb -U tr_app trazabilidad_simulacro
          ultimo="$(ls -d respaldos/respaldo-* | sort | tail -1)"
          docker compose --profile respaldo run --rm \
            -e ARCHIVOS_DIR_DESTINO=/respaldos/simulacro-archivos \
            respaldo /scripts/restaurar.sh "/$ultimo"
